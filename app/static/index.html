<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART Data Collector</title>
    <link rel="icon" type="image/png" href="/static/icon.png">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
            integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
            crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>SMART Data Collector</h1>
            <div class="header-actions">
                <button id="collectBtn" class="btn">Run SMART</button>
                <button id="refreshBtn" class="btn">Refresh</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="dashboard">Dashboard</button>
            <button class="tab" data-tab="drives">Drives</button>
            <button class="tab" data-tab="settings">Settings</button>
        </nav>

        <main>
            <!-- Dashboard Tab -->
            <section id="dashboard" class="tab-content active">
                <div class="drive-grid" id="driveGrid">
                    <!-- Drive cards will be populated here -->
                </div>
            </section>

            <!-- Drives Tab -->
            <section id="drives" class="tab-content">
                <div class="drives-table-container">
                    <table class="drives-table">
                        <thead>
                            <tr>
                                <th>Serial</th>
                                <th>Model</th>
                                <th>Type</th>
                                <th>Path</th>
                                <th>Size</th>
                                <th>Last Seen</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="drivesTableBody">
                            <!-- Drive rows will be populated here -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Settings Tab -->
            <section id="settings" class="tab-content">
                <div class="settings-panel">
                    <h2>Collection Settings</h2>
                    <div class="setting-group">
                        <label for="collectionInterval">Collection Interval (minutes)</label>
                        <input type="number" id="collectionInterval" min="1" value="360">
                    </div>
                    <button id="saveSettings" class="btn">Save Settings</button>

                    <h2>Drive History</h2>
                    <div class="setting-group">
                        <label for="historyDrive">Select Drive</label>
                        <select id="historyDrive"></select>
                        <button id="loadHistory" class="btn">Load History</button>
                    </div>
                    <div class="chart-container">
                        <canvas id="historyChart"></canvas>
                    </div>
                </div>
            </section>
        </main>

        <!-- Drive Detail Modal -->
        <div id="driveModal" class="modal hidden">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div class="modal-nav">
                    <button id="modalPrevBtn" class="btn btn-small" onclick="navigateDrive(-1)">&larr; Prev</button>
                    <button id="modalNextBtn" class="btn btn-small" onclick="navigateDrive(1)">Next &rarr;</button>
                </div>
                <h2 id="modalTitle">Drive Details</h2>
                <div class="modal-body">
                    <div class="chart-container">
                        <canvas id="modalChart"></canvas>
                    </div>
                    <div class="stats-grid" id="modalStats">
                        <!-- Stats will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
